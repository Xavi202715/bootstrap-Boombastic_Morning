<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario de Pago</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      padding: 40px;
    }
    .pago-card {
      max-width: 600px;
      margin: auto;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <div class="pago-card">
    <h2 class="text-center mb-4 text-success fw-bold">Formulario de Pago</h2>
    <form class="was-validated">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre completo</label>
        <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre" required>
      </div>

      <div class="mb-3">
        <label for="correo" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="correo" placeholder="ejemplo@email.com" required>
      </div>

      <div class="mb-3">
        <label for="telefono" class="form-label">Teléfono</label>
        <input type="tel" class="form-control" id="telefono" placeholder="+503 7000-0000" required>
      </div>

      <div class="mb-3">
        <label for="tour" class="form-label">Selecciona el tour</label>
        <select id="tour" class="form-select" required>
          <option selected disabled value="">Elige una opción</option>
          <option>Tour VIP en helicóptero por Miami</option>
          <option>Crucero turístico oficial de Miami Millionaires</option>
          <option>Tour en barco por la Bahía de Biscayne</option>
          <option>Exploración de Isla Mapache en SUP/Kayak</option>
          <option>Tour en hidrodeslizador por los Everglades</option>
          <option>Recorrido gastronómico en Little Havana</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="metodoPago" class="form-label">Método de pago</label>
        <select id="metodoPago" class="form-select" required>
          <option selected disabled value="">Selecciona un método</option>
          <option>Tarjeta de crédito / débito</option>
          <option>PayPal</option>
          <option>Transferencia bancaria</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="comentarios" class="form-label">Comentarios o instrucciones especiales</label>
        <textarea id="comentarios" class="form-control" rows="3"></textarea>
      </div>
          <!-- 🔹 Botón que abre el modal -->
      <button type="button" class="btn btn-success w-100" data-bs-toggle="modal" data-bs-target="#pagoExitosoModal">
        Confirmar pago
      </button>
    </form>
  </div>
     

    

  <!-- 🔹 Modal de confirmación de pago -->
  <div class="modal fade" id="pagoExitosoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title w-100">Pago finalizado</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
          <p class="mt-3 fs-5">¡Tu pago ha sido procesado con éxito! 🎉</p>
          <p>Gracias por elegir <strong>Viajes Miami</strong>. Te enviaremos un correo con los detalles de tu tour.</p>
        </div>
        <div class="modal-footer">
          <a href="index.html" class="btn btn-primary w-100">Volver al inicio</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Iconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</body>
</html>
